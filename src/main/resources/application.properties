spring.application.name=celugrama
#server.port=9495
spring.jpa.database=postgresql
spring.jpa.show-sql=false 
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=validate

spring.datasource.driver-class-name=org.postgresql.Driver
#Desde Spring Boot 3.1
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=jdbc:postgresql://localhost:5432/celugrama2025
spring.datasource.username=postgres
spring.datasource.password=poderoso

# Flyway - migraciones de estructura versionadas
spring.flyway.enabled=true
# Adopta la BD existente (Mac) como si ya tuviera aplicada la V1,
# sin volver a ejecutarla. En una BD vacia (Windows) no aplica:
# Flyway simplemente corre la V1 normalmente.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Ejecuta data.sql DESPUES de que Hibernate/Flyway preparen el esquema
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=always
