spring.application.name=celugrama
#server.port=9495
spring.jpa.database=postgresql
spring.jpa.show-sql=false 
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=validate

spring.datasource.driver-class-name=org.postgresql.Driver
#Desde Spring Boot 3.1
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# Si existe la variable de entorno (Render), la usa.
# Si no existe (tu Mac o Windows), usa el valor por defecto local.
#spring.datasource.url=jdbc:postgresql://localhost:5432/celugrama2025
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/celugrama2025}
#spring.datasource.username=postgres
spring.datasource.username=${DB_USER:postgres}
#spring.datasource.password=poderoso
spring.datasource.password=${DB_PASSWORD:poderoso}

# Flyway - migraciones de estructura versionadas
spring.flyway.enabled=true
# Adopta la BD existente (Mac) como si ya tuviera aplicada la V1,
# sin volver a ejecutarla. En una BD vacia (Windows) no aplica:
# Flyway simplemente corre la V1 normalmente.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Ejecuta data.sql DESPUES de que Hibernate/Flyway preparen el esquema
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=always

# En el servidor de produccion no hay navegador ni pantalla
app.abrir-swagger=${ABRIR_SWAGGER:true}

# Dominios de tu frontend que pueden consumir esta API, separados por coma.
# En Render se sobreescribe con la variable de entorno FRONTEND_URLS
app.frontend-urls=${FRONTEND_URLS:http://localhost:4200}
